  # --- custom career platform (dedicated adapter, not a standard ATS) ---
  # Microsoft's own careers backend; see scraper/adapters/microsoft.py.
  - type: microsoft
    company: microsoft

  # --- oracle recruiting cloud (public candidate-experience REST API) ---
  # host + site come from the careers URL:
  #   https://{host}/hcmUI/CandidateExperience/en/sites/{site_name}
  # site_number (API) is usually CX_1. See scraper/adapters/oracle.py.
  - type: oracle
    company: dell
    host: iawmqy.fa.ocs.oraclecloud.com
    site_number: CX_1
    site_name: careers
  # TI fronts Oracle on careers.ti.com, but the REST API only answers on the
  # underlying Fusion host (found embedded in the careers page).
  - type: oracle
    company: texas-instruments
    host: edbz.fa.us2.oraclecloud.com
    site_number: CX_1
    site_name: CX
  - type: oracle
    company: oracle
    host: eeho.fa.us2.oraclecloud.com
    site_number: CX_1
    site_name: jobsearch
  - type: oracle
