# JobPoll watchlist. User-editable; contains no secrets, so the repo can be
# public. Adding a company of an existing type = one entry under `sources:`.
#
# Migration trap: before adding a company, confirm its Apply links actually
# point at that ATS. A board a company migrated away from returns 200 with
# zero jobs forever (e.g. deel and kraken have empty abandoned boards;
# mercury and plaid moved ATSes, so their OLD boards are empty - the live
# greenhouse/ashby ones are what's on the list below). Probe first:
#   ashby:      https://api.ashbyhq.com/posting-api/job-board/{company}
#   greenhouse: https://boards-api.greenhouse.io/v1/boards/{company}/jobs
#   lever:      https://api.lever.co/v0/postings/{company}?mode=json
#   workday:    POST https://{company}.{instance}.myworkdayjobs.com/wday/cxs/{company}/{site}/jobs
#               body {"appliedFacets":{},"limit":20,"offset":0,"searchText":""}
#   ultipro:    POST https://{host}/{tenant}/JobBoard/{board}/JobBoardView/LoadSearchResults
#               body {"opportunitySearch":{"Top":10,"Skip":0,"QueryString":"","OrderBy":
#               [{"Value":"postedDateDesc","PropertyName":"PostedDate","Ascending":false}],
#               "Filters":[]},"matchCriteria":{"PreferredJobs":[],"Educations":[],
#               "LicenseAndCertifications":[],"Skills":[],"hasNoLicenses":false,"SkippedSkills":[]}}
#
# UltiPro (UKG Pro Recruiting) needs three values, all readable off the board
# URL: for https://recruiting.ultipro.ca/PAS5000PASON/JobBoard/736c1025-.../
# the entry is host: recruiting.ultipro.ca / tenant: PAS5000PASON /
# board: 736c1025-... (the GUID). host defaults to recruiting.ultipro.com.
#
# Workday needs three values, all readable off the board URL: for
# https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite the entry is
# company: nvidia / instance: wd5 / site: NVIDIAExternalCareerSite. The
# adapter fetches only the newest ~60 postings per poll (boards hold
# thousands), which the 5-minute cadence makes lossless.
#
# Slug collision trap: a live board can belong to a different company than
# the name suggests (ashby "runway" is Runway Financial, not Runway ML;
# "warp" is Warp the payroll startup, not warp.dev). After probing, read a
# couple of job titles to confirm it is the company you meant.
#
# FAANG run custom career sites with no public board API. Amazon, Google,
# and Microsoft have dedicated adapters that scrape the JSON behind their own
# search pages (see the custom career sites section). Meta blocks every non-browser
# client (its GraphQL, sitemap, and even robots.txt reject plain HTTP
# clients, and its robots.txt prohibits automated collection), so
# Meta/Apple/Netflix roles arrive via the SimplifyJobs feeds below instead.

